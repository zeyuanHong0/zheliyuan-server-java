spring:
  docker:
    compose:
      enabled: false
  config:
    import: optional:file:./config/secrets-dev.yml
  mail:
    host: ${app.email.host:smtp.qq.com}
    port: ${app.email.port:465}
    username: ${app.email.auth-user:}
    password: ${app.email.auth-pass:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
