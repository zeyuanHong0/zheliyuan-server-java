spring:
  application:
    name: blog-back-java
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.zly.blogbackjava.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
